# BGG Hype Fade — pipeline configuration (steps 1–5)
# Every threshold and rule used by the pipeline lives here. See docs/data_notes.md for why.

source:
  repo: beefsack/bgg-ranking-historicals
  branch: master                      # verified 2026-10-18 (HEAD -> refs/heads/master)
  raw_url_template: "https://raw.githubusercontent.com/{repo}/{branch}/{file}"
  tree_api_url: "https://api.github.com/repos/{repo}/git/trees/{branch}"   # flat repo: all CSVs at root
  git_url: "https://github.com/beefsack/bgg-ranking-historicals.git"
  filename_pattern: '^\d{4}-\d{2}-\d{2}\.csv$'

download:
  backend: http                       # http | git  (git = blobless clone + per-file checkout)
  mode: monthly                       # monthly only for now; daily comes later (robustness check)
  start_month: 2016-10-01
  end_month: 2026-10-01               # PINNED for reproducibility; archive grows daily
  max_candidate_day: 10               # look at most at days 1..10 of a month for a valid file
  min_row_ratio: 0.99                 # accept a file only if rows >= ratio * rows of previous accepted month
  timeout_seconds: 60
  max_retries: 5
  backoff_factor: 2

paths:
  raw_dir: data/raw
  rejected_dir: data/raw/rejected     # truncated files kept here for transparency; never loaded
  manifest: data/raw/manifest.csv
  duckdb: data/interim/bgg.duckdb
  interim_dir: data/interim
  processed_dir: data/processed
  qc_dir: reports/qc
  tables_dir: reports/tables
  figures_dir: reports/figures

load:
  dedup_order: "n_raters DESC, rank ASC"   # keep one row per (snap_date, game_id)

cohort:
  first_snapshot_month: 2016-10-01    # games present here are left-censored -> excluded
  new_release_max_age_years: 1        # pub_year_at_entry >= year(entry_month) - 1
  min_valid_pub_year: 1               # 0 = unknown
  max_pub_year_slack: 1               # pub_year > year(end_month) + slack -> junk (e.g. 2200, 3500)
  main_entry_start: 2017-01-01
  followup_months: 36                 # main_entry_end = end_month - followup_months  (= 2023-10-01)
  max_k: 36                           # panel keeps months_since_entry 0..max_k

new_rating_average:
  rounding_half_unit: 0.005           # Average is published with 2 decimals
  min_delta_raters: 10                # sensitivity later: 5 / 10 / 25
  max_error_bound: 0.5                # sensitivity later: 0.25 / 0.5 / 1.0
  windows: [1, 3]                     # months: k vs k-1 and k vs k-3
  valid_range: [1.0, 10.0]

summary:
  milestones: [0, 3, 6, 12, 24, 36]
  hype_month: 6
  hype_quartile_partition: entry_year

# Expected values for the QC stage (docs/data_notes.md sections 3, 5, 8). Added after the pipeline spec.
qc:
  expected_substituted_months: [2024-01-01, 2024-09-01]
  tolerance_mean_change: 0.03
  expected_mean_change: {12: -0.238, 24: -0.332, 36: -0.400}   # all new releases, from k=0
  pilot_games_with_missing_month: 442
  # New releases by entry year. 2021 is 977, not the pilot's 978: the pilot counted Knucklebones
  # (id 11726, Year = 3000 = junk) as a new release; the junk-year rule correctly excludes it.
  expected_new_releases: {2017: 1033, 2018: 1045, 2019: 1068, 2020: 921, 2021: 977, 2022: 1055, 2023: 1213}
  # Pilot observed-at-m36 counts (naive first-of-month files). Lower values would be a regression.
  pilot_observed_m36: {2017: 1028, 2018: 1039, 2019: 1062, 2020: 910, 2021: 965, 2022: 1047}
  spot_checks:   # data_notes section 8; avg tolerance 0.01, raters exact
    - {id: 174430, name: Gloomhaven, entry: 2016-10-01, pub_year: 2016, in_cohort: false, avg_k0: 8.67, raters_k0: 58, raters_k6: 2516, avg_k12: 9.01, avg_k36: 8.87, raters_k36: 28171}
    - {id: 233078, name: Twilight Imperium (4th Ed.), entry: 2017-09-01, pub_year: 2017, in_cohort: true, avg_k0: 8.77, raters_k0: 82, raters_k6: 2098, avg_k12: 8.80, avg_k36: 8.69, raters_k36: 11607}
    - {id: 224517, name: "Brass: Birmingham", entry: 2017-12-01, pub_year: 2018, in_cohort: true, avg_k0: 8.73, raters_k0: 33, raters_k6: 65, avg_k12: 8.67, avg_k36: 8.65, raters_k36: 17047}
    - {id: 266192, name: Wingspan, entry: 2019-01-01, pub_year: 2019, in_cohort: true, avg_k0: 8.08, raters_k0: 32, raters_k6: 9083, avg_k12: 8.09, avg_k36: 8.10, raters_k36: 55431}
    - {id: 295770, name: Frosthaven, entry: 2020-01-01, pub_year: 2021, in_cohort: true, avg_k0: 7.09, raters_k0: 48, raters_k6: 305, avg_k12: 7.18, avg_k36: 7.75, raters_k36: 1052}
    - {id: 291457, name: "Gloomhaven: Jaws of the Lion", entry: 2020-07-01, pub_year: 2020, in_cohort: true, avg_k0: 9.22, raters_k0: 438, raters_k6: 5822, avg_k12: 8.78, avg_k36: 8.50, raters_k36: 29202}
    - {id: 312484, name: Lost Ruins of Arnak, entry: 2020-10-01, pub_year: 2020, in_cohort: true, avg_k0: 8.16, raters_k0: 39, raters_k6: 3665, avg_k12: 8.11, avg_k36: 8.08, raters_k36: 37788}
    - {id: 295947, name: Cascadia, entry: 2020-10-01, pub_year: 2021, in_cohort: true, avg_k0: 7.95, raters_k0: 66, raters_k6: 228, avg_k12: 8.09, avg_k36: 7.97, raters_k36: 29574}
    - {id: 316554, name: "Dune: Imperium", entry: 2020-12-01, pub_year: 2020, in_cohort: true, avg_k0: 8.04, raters_k0: 71, raters_k6: 4877, avg_k12: 8.31, avg_k36: 8.42, raters_k36: 39421}
    - {id: 342942, name: Ark Nova, entry: 2021-11-01, pub_year: 2021, in_cohort: true, avg_k0: 8.50, raters_k0: 252, raters_k6: 6383, avg_k12: 8.60, avg_k36: 8.53, raters_k36: 46693}

# ---- Analysis (task 02). Every choice below is a fixed research definition; see docs/handoff/02_TASK_analysis.md.
analysis:
  seed: 20261018
  bootstrap_reps: 1000
  ci_z: 1.96                          # 95% normal-approximation CI for means
  curve_k_max: 36
  horizons: [12, 24, 36]              # k at which changes are reported; balanced sample must observe all
  results_dir: reports/results
  external_dir: data/external/kaggle_bgg
  control:                            # mature control group for background drift
    base_month: 2016-10-01
    min_raters: 500
  gap:
    window: 3                         # use new_avg_3 / new_avg_ok_3
    ks: [3, 6, 12, 24, 36]
  segments:
    avg0_quintiles: 5
    avg0_deciles: 10
    entry_raters_edges: [35, 50, 100] # buckets: <35, 35-49, 50-99, 100+
    popular_top_share: 0.10           # top share of raters_m36
  examples:
    min_raters_m36: 5000
    n_decliners: 2
    n_risers: 2
    n_typical: 2
  q4:
    k_max: 30
    tolerances: [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50]   # dashboard slider steps
    rule_tolerance: 0.25
    rule_share: 0.80
    adjusted_ks: [0, 3, 6, 12]
    train_entry_years: [2017, 2019]   # inclusive
    test_entry_years: [2020, 2023]    # inclusive
  robustness:
    covid_entry_years: [2020, 2021]
    min_entry_raters: 50
    popular_top_share: 0.10
    gap_ks: [6, 12, 36]
    gap_min_delta_raters: [5, 10, 25]
    gap_max_error_bound: [0.25, 0.5, 1.0]
  q3:
    min_coverage: 0.5                 # entry years below this get coverage only, no model
    id_column: BGGId
    flag_column: Kickstarted
  # --- task 03 additions
  speed:
    months: [6, 36]                    # dumbbell: change by month 6 vs month 36, per hype quartile
  rank_compare:
    top_ranks: [90, 110]               # rank window "around 100" in the end-month snapshot
    low_ranks: [990, 1010]             # rank window "around 1000"
  kickstarter:
    band_start: 6.5                    # 0.5-wide bands of avg_m0 for the within-band comparison
    band_end: 9.0
    band_width: 0.5
    min_band_n: 30                     # per group, for the band-gap range
  hist:
    x_range: [-3.0, 2.0]               # Fig 4 histogram range
  social_card_px: [1200, 630]
  titles:                              # action titles; {key|abs|pct:fmt} filled from key_numbers at runtime
    fig01:
      title: "New games lose {change_36|abs:.2f} rating points in 3 years, {share_of_decline_by_12|pct:.0f}% of it in year one"
      subtitle: "Mean change in displayed average since entering the ranking (main sample, 95% CI)"
    fig02:
      title: "New raters still rate games {gap_k36|abs:.2f} below the displayed average at month 36"
      subtitle: "New-rater average minus displayed average, usable game-months only (95% CI)"
    fig03:
      title: "The fade is specific to new games: site-wide drift explains only {control_drift_36|abs:.3f} of it"
      subtitle: "Change by launch year, against the mature control group over the same months"
    fig04:
      title: "{share_declining|pct:.0f}% of new games end lower than they started"
      subtitle: "Distribution of the 36-month change, and the change by starting rating"
    fig05:
      title: "Example trajectories: displayed average vs what new raters say"
      subtitle: "Six games chosen by rule among those with at least {examples_min_raters:,.0f} raters at month 36"
    fig06:
      title: "Hype changes how fast ratings fall, not how far"
      subtitle: "Mean change since entry by hype quartile (growth in raters during months 0-6)"
    fig07:
      title: "Within the same game, the rating keeps falling for three years (month 36: {beta_36:+.2f})"
      subtitle: "Event-study coefficients vs month 0, game fixed effects, 95% CI"
    fig08:
      title: "It takes about {q4_rule_month:.0f} months before a new game's rating can be trusted"
      subtitle: "Share of games within the tolerance of their month-36 rating"
    fig09:
      title: "Hype changes how fast ratings fall, not how far"
      subtitle: "Mean change in displayed average by hype quartile, at month 6 and at month 36 (95% CI)"
    fig10:
      title: "Kickstarted games fall further, even from the same starting rating"
      subtitle: "Change to month 36 by starting-rating band, 2017-2021 entries (descriptive; flag from a 2022 snapshot)"
  # Values from docs/data_notes.md section 11, compared (not enforced) in reports/results/sanity_checks.csv
  sanity:
    tolerance: 0.01
    values:
      n_main_sample: 6927
      n_balanced_sample: 6918
      n_control_games: 2428
      change_12: -0.245
      change_24: -0.341
      change_36: -0.401
      median_change_36: -0.38
      share_declining: 0.869
      control_drift_36: -0.016
      change_36_control_adjusted: -0.385
      change_36_rater_weighted: -0.274
      gap_k3: -0.15
      gap_k12: -0.20
      gap_k36: -0.23
      spec_a_hype: 0.05
      spec_b_hype: 0.00
      q4_within_025_k0: 0.315
      q4_within_025_k6: 0.55
      q4_within_025_k12: 0.77
      q4_within_025_k18: 0.91
      change_6_by_hype_q1: -0.099
      change_6_by_hype_q2: -0.156
      change_6_by_hype_q3: -0.210
      change_6_by_hype_q4: -0.193
      gap_k36_by_hype_q1: -0.30
      gap_k36_by_hype_q2: -0.24
      gap_k36_by_hype_q3: -0.22
      gap_k36_by_hype_q4: -0.23
      ks_avg_m0: 7.62
      nonks_avg_m0: 7.23
      ks_gap_within_bands: -0.08
      share_rank_improved_36: 0.74
      avg_rank100: 7.93
      avg_rank1000: 7.30
    loose_tolerance: {gap_k36_by_hype_q1: 0.02, ks_gap_within_bands: 0.02, spec_b_hype: 0.02, n_main_sample: 0, n_balanced_sample: 0, n_control_games: 0}   # spec says B = 0.00 +/- 0.02; counts exact

# Publication details. Empty strings = not published yet; README renders without the dead links/badges.
publish:
  author: "Резниченко Никита"          # name on the MIT licence and in pyproject (confirm before publishing)
  github_repo: ""                      # "owner/bgg-hype-fade" once the repository exists
  dashboard_url: ""                    # Streamlit Community Cloud app URL
  pages_url: ""                        # GitHub Pages URL of the offline dashboard
