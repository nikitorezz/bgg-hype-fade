name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Tests (data-dependent tests skip: the repository holds no raw data)
        run: uv run pytest -q
      - name: README is up to date
        run: uv run python scripts/render_readme.py --check
