[project]
name = "bgg"
version = "0.1.0"
description = "Does the Hype Fade? BGG post-release rating trajectories: data pipeline"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
]

[project.scripts]
bgg = "bgg.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
