[project]
name = "bgg"
version = "0.1.0"
description = "Does the Hype Fade? BGG post-release rating trajectories: data pipeline"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "requests>=2.31",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
    "linearmodels>=7.1",
    "pyarrow>=26.0.0",
]

[project.scripts]
bgg = "bgg.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "plotly>=7.1.0",
    "pytest>=8",
    "ruff>=0.5",
    "streamlit>=1.66.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgg"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/bgg/static_export.py" = ["E501"]  # HTML template

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "app"]
